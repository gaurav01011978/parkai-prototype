<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkAI · AI Assistant</title>
<link rel="stylesheet" href="/static/ui.css">
<style>
  .chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
  .log{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m.bot{background:#eff6ff;color:var(--text);border-bottom-left-radius:4px;align-self:flex-start}
  .m.me{background:var(--sign);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .m.err{background:#fee2e2;color:#991b1b;align-self:flex-start}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
  .sugg button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--sign);cursor:pointer}
  .bar{display:flex;gap:8px;margin-top:10px}
  .bar input{flex:1}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .locked{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><div class="logo">P</div>AI Assistant</div>
  <div><a href="/plans">Plans</a><a href="/user">Find parking</a><a href="/advance">Advance reserve</a></div>
</div></div>

<div class="wrap">
  <div class="card" id="locked" hidden>
    <div class="locked">
      <h2>The AI Assistant is part of ParkAI plans</h2>
      <p class="muted" id="lockedWhy">Choose a Basic, Pro or Premium plan to chat with the assistant. Manual parking search and reservations stay free.</p>
      <a class="btn" href="/plans">View plans</a>
    </div>
  </div>

  <div class="card chat" id="chatCard" hidden>
    <div class="meta"><span id="planInfo"></span>
      <span><button class="btn ghost sm" id="locBtn" type="button">Use my location</button>
      <button class="btn ghost sm" id="newBtn" type="button">New chat</button></span></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="sugg" id="sugg"></div>
    <form class="bar" id="form" autocomplete="off">
      <input id="msg" maxlength="500" placeholder="Ask about parking, prices, bookings…" aria-label="Message">
      <button class="btn" id="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const SUBKEY = 'parkai_sub', ADV = 'parkai_adv', SESS = 'parkai_assistant_session';
  const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(d)); } catch (e) { return d; } };
  const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let sub = jget(SUBKEY, null), sid = jget(SESS, null), loc = null, busy = false;

  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'm ' + cls; d.textContent = text;   // textContent => XSS-safe
    $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  }
  function chips(list) {
    const box = $('sugg'); box.innerHTML = '';
    (list || []).forEach(t => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
      b.onclick = () => send(t); box.appendChild(b);
    });
  }
  function showLocked(why) {
    $('chatCard').hidden = true; $('locked').hidden = false;
    if (why) $('lockedWhy').textContent = why;
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    busy = true; $('send').disabled = true;
    add(text, 'me'); $('msg').value = ''; chips([]);
    try {
      const r = await fetch('/api/assistant/chat', { method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text, session_id: sid, sub_code: sub.code, sub_token: sub.token,
                               items: jget(ADV, []), lat: loc && loc.lat, lng: loc && loc.lng }) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401 || r.status === 402) { showLocked(d.error); return; }
      if (!r.ok) { add(d.error || 'Something went wrong.', 'err'); return; }
      sid = d.session_id; jset(SESS, sid);
      if (d.store_booking) {            // same store as /advance page
        const list = jget(ADV, []);
        if (!list.some(x => x.code === d.store_booking.code)) list.push(d.store_booking);
        jset(ADV, list);
      }
      add(d.reply, 'bot'); chips(d.suggestions);
      if (d.usage) $('planInfo').textContent = $('planInfo').dataset.base + ` · ${d.usage.used}/${d.usage.limit} messages today`;
    } catch (e) {
      add('Could not reach the server. Please try again.', 'err');
    } finally { busy = false; $('send').disabled = false; $('msg').focus(); }
  }

  $('form').onsubmit = e => { e.preventDefault(); send($('msg').value); };
  $('newBtn').onclick = () => { sid = null; jset(SESS, null); $('log').innerHTML = ''; welcome(); };
  $('locBtn').onclick = () => {
    if (!navigator.geolocation) { add('Your browser does not support location.', 'err'); return; }
    navigator.geolocation.getCurrentPosition(p => {
      loc = {lat: p.coords.latitude, lng: p.coords.longitude};
      $('locBtn').textContent = 'Location on ✓';
      add('Location shared. Ask me to find parking and I will include distance.', 'bot'); chips(['Find parking near me']);
    }, () => add('Location permission was denied, so I will rank by availability only.', 'err'));
  };
  function welcome() {
    add('Hi! I\'m your ParkAI assistant. I can find parking from live data, quote prices, and book, show or cancel reservations — I always ask before booking or cancelling.', 'bot');
    chips(['Find parking', 'Book a spot', 'My bookings', 'Pricing']);
  }

  (async function init() {
    if (!sub) { showLocked(); return; }
    const r = await fetch(`/api/subscriptions/${encodeURIComponent(sub.code)}?t=${encodeURIComponent(sub.token)}`);
    const s = await r.json().catch(() => ({}));
    if (!r.ok || !s.eligible) {
      showLocked(r.ok && s.status === 'EXPIRED' ? 'Your plan has expired. Renew it to keep using the AI Assistant.' : null);
      return;
    }
    $('planInfo').dataset.base = `${s.plan.name} plan`;
    $('planInfo').textContent = `${s.plan.name} plan`;
    $('chatCard').hidden = false;
    welcome();
  })();
</script>
</body>
</html>
